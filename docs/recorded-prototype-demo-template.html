<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kairos · 真实 Minecraft 证据回放</title>
<style>
:root{color-scheme:dark;background:#111922;color:#e5edf2;font:16px system-ui}body{max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:26px;font-weight:500}h2{font-size:18px;font-weight:500}p{line-height:1.6}.muted{color:#afbdc7}select,button,input{font:inherit}select,button{background:#24333f;color:inherit;border:1px solid #567080;border-radius:6px;padding:8px}button:disabled{opacity:.4}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panes{display:grid;grid-template-columns:3fr 2fr;gap:24px;margin:20px 0}canvas{width:100%;background:#182630;border-radius:8px}#world{aspect-ratio:4/3}#field{aspect-ratio:4/3}pre{font:13px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}#proof{padding:12px 0;border-top:1px solid #3a4b57}#timeline{width:100%}small{line-height:1.5}a{color:#8cdbca}@media(max-width:750px){.panes{grid-template-columns:1fr}body{margin:20px auto}}</style>
<h1>Kairos · 真实 Minecraft 证据回放</h1>
<p class="muted" id="limits"></p>
<div class="toolbar"><label>证据 <select id="case"></select></label><button id="previous">上一动作</button><button id="next">下一动作</button><span id="step"></span></div>
<div class="panes"><section><h2>当时可见的世界</h2><canvas id="world" aria-label="真实公开物体的第一视角示意重建"></canvas><label id="frameLabel" for="timeline"></label><input id="timeline" type="range" min="0" value="0"><small class="muted">仅绘制该帧实际公开的方块；未观察区域保持空白。图形为示意，不补建墙后或视野外世界。</small></section>
<section><h2>联合场竞争</h2><canvas id="field" aria-label="动作决定时真实场点的激活"></canvas><p id="decision"></p><p id="proof"></p></section></div>
<h2>实际动作与回执</h2><pre id="receipt"></pre><details><summary>原始来源与核验范围</summary><pre id="source"></pre></details>
<script>
const data=/*__EVIDENCE__*/;
const element=id=>document.getElementById(id);let caseIndex=0,stepIndex=0;
const names={'interact':'交互','look':'转向','move':'移动','jump':'跳跃','wait':'等待','observe':'观察','select-hotbar':'快捷栏',execute:'执行','observe-public':'公开观察','predict-branch':'物理推演','compare-condition':'条件比较','recall-effect':'反查经验','expand-condition':'展开条件','finish-verified':'现实验证完成'};
element('limits').textContent=data.limits;
data.cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.title;element('case').append(o)});
function drawWorld(frame){const c=element('world');c.width=800;c.height=600;const x=c.getContext('2d');x.fillStyle='#182630';x.fillRect(0,0,800,600);const yaw=frame.self.yaw,pitch=frame.self.pitch;
function project(v){const right=Math.cos(yaw)*v[0]-Math.sin(yaw)*v[2],forward=-Math.sin(yaw)*v[0]-Math.cos(yaw)*v[2],up=v[1]-1.62;const depth=forward*Math.cos(pitch)+up*Math.sin(pitch),vertical=up*Math.cos(pitch)-forward*Math.sin(pitch);return depth>.08?[400+right/depth*510,300-vertical/depth*510,depth]:null}
const faces=[];const indices=[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]];
for(const o of frame.objects.filter(o=>o.id.startsWith('block:'))){const p=o.relativePosition,vertices=[];for(let k=0;k<8;k++)vertices.push(project([p[0]+((k&1)?.5:-.5),p[1]+((k&2)?.5:-.5),p[2]+((k&4)?.5:-.5)]));for(let f=0;f<indices.length;f++){const v=indices[f].map(i=>vertices[i]);if(v.every(Boolean))faces.push({v,o,f,depth:v.reduce((s,p)=>s+p[2],0)/4})}}
faces.sort((a,b)=>b.depth-a.depth);for(const {v,o,f}of faces){x.fillStyle=o.type==='note_block'?['#946c46','#795134','#bb8856'][f%3]:['#596a74','#637987','#485b66'][f%3];x.beginPath();x.moveTo(v[0][0],v[0][1]);v.slice(1).forEach(p=>x.lineTo(p[0],p[1]));x.closePath();x.fill();x.strokeStyle='#22323c';x.stroke()}
for(const o of frame.objects.filter(o=>o.type==='note_block')){const p=project(o.relativePosition);if(p){x.fillStyle='#fff2cb';x.font='19px system-ui';x.textAlign='center';x.fillText('音符状态 = '+o.properties.note,p[0],p[1]-16)}}x.strokeStyle='#e5edf2';x.beginPath();x.moveTo(390,300);x.lineTo(410,300);x.moveTo(400,290);x.lineTo(400,310);x.stroke();element('frameLabel').textContent='真实帧 '+frame.sequence+' · 体验时间 '+frame.activeSeconds.toFixed(2)+' 秒';}
function render(){const c=data.cases[caseIndex],s=c.steps[stepIndex];element('step').textContent=(stepIndex+1)+' / '+c.steps.length+' · '+(names[s.action.kind]||s.action.kind);element('previous').disabled=stepIndex===0;element('next').disabled=stepIndex===c.steps.length-1;const range=element('timeline');range.max=s.frames.length-1;range.value=0;drawWorld(s.frames[0]);
const canvas=element('field');canvas.width=560;canvas.height=420;const x=canvas.getContext('2d');x.clearRect(0,0,560,420);const sites=[...s.field].sort((a,b)=>b.activation-a.activation).slice(0,10),max=Math.max(1,...sites.map(s=>s.activation));x.font='15px system-ui';sites.forEach((a,i)=>{const y=18+i*38,w=Math.max(0,a.activation)/max*250;x.fillStyle=a.id===s.decision.siteId?'#67c8b3':'#547588';x.fillRect(230,y,w,20);x.fillStyle='#e5edf2';x.fillText((names[a.operation]||a.operation)+(a.id===s.decision.siteId?' · 胜出':''),8,y+16);x.fillText(a.activation.toFixed(3),490,y+16)});
element('decision').textContent='稳定胜者：'+(names[s.decision.operation]||s.decision.operation)+'；积分 '+s.decision.integrationSteps+' 步。';const e=s.evidence;element('proof').textContent=e?.physical?'已核验：冻结 R1/R2 经验有效，R2A 为 '+e.r2a+'；'+e.samples+' 个有效随机样本，目标进展率 '+Math.round(e.progress*100)+'%。':'这一步是观察或探索，不把它称为物理预测支持的目标动作。';element('receipt').textContent=JSON.stringify({action:s.action,eventId:s.eventId,receipt:s.receipt},null,2);element('source').textContent=JSON.stringify({source:c.source,eventsSha256:c.eventsSha256,goal:c.goal,recordIntegrity:c.recordIntegrity,goalAudit:c.goal?data.audit:null,physicalReferences:e?.physicalReferences??null},null,2);}
element('case').onchange=e=>{caseIndex=Number(e.target.value);stepIndex=0;render()};element('previous').onclick=()=>{stepIndex--;render()};element('next').onclick=()=>{stepIndex++;render()};element('timeline').oninput=e=>drawWorld(data.cases[caseIndex].steps[stepIndex].frames[Number(e.target.value)]);render();
</script></html>
